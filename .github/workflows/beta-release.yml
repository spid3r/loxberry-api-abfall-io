# Pre-releases on `beta`: semantic-release pre-release branch (see .releaserc.json).
# Topic branches (fix/*, feature/*) merge to `beta` via PR; only `beta` publishes betas.
name: Beta release

on:
  push:
    branches: [beta]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: semantic-release-beta
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Semantic release (pre-release on beta; ZIP + prerelease.cfg in prepare)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
